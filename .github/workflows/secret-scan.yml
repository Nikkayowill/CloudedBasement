name: Secret Scan

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tracked-file-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tracked-file secret scan
        run: node scripts/check-secrets.js
